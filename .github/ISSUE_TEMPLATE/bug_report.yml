name: Bug Report
description: Report something that's not working correctly
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.
  - type: textarea
    attributes:
      id: description
      label: Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    attributes:
      id: reproduce
      label: Steps to Reproduce
      placeholder: |
        1. Open the app
        2. Click on X
        3. See error
    validations:
      required: true
  - type: textarea
    attributes:
      id: expected
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    attributes:
      id: actual
      label: Actual Behavior
    validations:
      required: true
  - type: input
    attributes:
      id: version
      label: App Version
      placeholder: "0.1.0 — shown in the installer filename / LICENSE panel"
    validations:
      required: true
  - type: input
    attributes:
      id: os
      label: Operating System
      placeholder: "Windows 11 23H2, macOS 14.5"
    validations:
      required: true
  - type: dropdown
    attributes:
      id: area
      label: What area is affected?
      options:
        - Globe / imagery
        - Live feeds
        - Terrain or spectral analysis
        - Plugins
        - Sessions / LAN pairing
        - License / activation
        - Installer / launch
        - Not sure
    validations:
      required: true
  - type: textarea
    attributes:
      id: logs
      label: Logs / Console Output
      description: Any relevant errors (Help → DevTools console, if you can)
      render: shell
  - type: textarea
    attributes:
      id: screenshots
      label: Screenshots
  - type: checkboxes
    attributes:
      id: terms
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
